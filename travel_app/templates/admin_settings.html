{% extends 'admin_base.html' %}

{% block title %}Admin - Settings{% endblock %}

{% block extra_css %}
<style>
    .settings-container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        max-width: 800px;
        margin: 0 auto;
    }

    .settings-container h3 {
        color: #333;
        margin-bottom: 20px;
        border-bottom: 2px solid #00bbff;
        padding-bottom: 10px;
        display: inline-block;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 500;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        transition: border-color 0.3s;
    }

    .form-group input:focus {
        border-color: #00bbff;
    }

    .btn-save {
        background-color: #00bbff;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
    }

    .btn-save:hover {
        background-color: #0099cc;
    }
</style>
{% endblock %}

{% block main_content %}
<div class="settings-container">
    <h3>Profile Settings</h3>
    <form action="{% url 'profile' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" value="{{ request.user.first_name }}">
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ request.user.email }}">
        </div>

        <div class="form-group">
            <label for="profile_pix">Profile Picture</label>
            <input type="file" id="profile_pix" name="profile_pix" accept="image/*" style="margin-top: 10px;">
        </div>
        
        <button type="submit" class="btn-save">Save Changes</button>
    </form>
</div>
{% endblock %}
