{% load static %}
<style>
    /* --- Modern Glassmorphism Navbar --- */
    .custom-navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
        background: rgba(32, 149, 174, 0.85); /* Primary Teal Color */
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        transition: all 0.4s ease-in-out;
        padding: 10px 0;
    }

    .custom-navbar.scrolled {
        background: rgba(21, 74, 74, 0.95); /* Darker teal on scroll */
        padding: 5px 0;
    }

    .custom-navbar .logo img {
        width: 90px;
        height: auto;
        transition: transform 0.3s ease;
    }

    .custom-navbar .logo:hover img {
        transform: scale(1.1) rotate(5deg);
    }

    .custom-navbar ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .custom-navbar ul li a {
        position: relative;
        text-decoration: none;
        color: white;
        font-weight: 500;
        font-size: 16px;
        padding: 5px 0;
        transition: color 0.3s ease;
    }

    /* Animated Underline Effect */
    .custom-navbar ul li a::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: #5ee4ff; /* Bright accent cyan */
        transition: width 0.3s ease;
        border-radius: 2px;
    }

    .custom-navbar ul li a:hover::after,
    .custom-navbar ul li a.active::after {
        width: 100%;
    }

    .custom-navbar ul li a:hover {
        color: #5ee4ff;
    }

    .custom-navbar .auth-buttons {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .btn-custom-login {
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.6);
        padding: 6px 20px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
    }

    .btn-custom-login:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: white;
        transform: translateY(-2px);
    }

    .btn-custom-register {
        background: linear-gradient(135deg, #5ee4ff, #2095ae);
        color: white;
        padding: 8px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 700;
        border: none;
        box-shadow: 0 4px 15px rgba(94, 228, 255, 0.4);
        transition: all 0.3s ease;
    }

    .btn-custom-register:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(94, 228, 255, 0.6);
        color: white;
    }

    /* Desktop specific styles for the wrapper */
    @media (min-width: 992px) {
        .nav-collapse {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-grow: 1;
            margin-left: 40px;
        }
    }

    /* Mobile Menu Styles */
    .mobile-menu-toggle {
        display: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
    }

    @media (max-width: 991px) {
        .nav-collapse {
            display: none; /* Hide on mobile initially */
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: rgba(21, 74, 74, 0.98);
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .custom-navbar.mobile-menu-active .nav-collapse {
            display: flex;
        }

        .custom-navbar ul {
            flex-direction: column;
            width: 100%;
            gap: 15px;
            margin-bottom: 20px;
        }

        .custom-navbar .auth-buttons {
            flex-direction: column;
            width: 100%;
            gap: 10px;
        }

        .btn-custom-login, .btn-custom-register {
            width: 100%;
            text-align: center;
        }

        .mobile-menu-toggle {
            display: block;
        }
    }
</style>

<header class="custom-navbar" id="main-navbar">
    <div class="container d-flex align-items-center justify-content-between">
        <!-- Logo -->
        <a href="{% url 'home' %}" class="logo">
            <img src="{% static 'img/Eqz7Dy-travel-world-transparent-logo.png' %}" alt="Logo">
        </a>  

        <!-- Mobile Menu Icon -->
        <div class="mobile-menu-toggle" id="mobile-toggle-btn">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="nav-collapse">
            <!-- Navigation Links -->
            <ul>
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% if request.resolver_match.url_name != 'home' %}{% url 'home' %}{% endif %}#about">About Us</a></li>
                <li><a href="{% if request.resolver_match.url_name != 'home' %}{% url 'home' %}{% endif %}#choose-place">Tours</a></li>
                <li><a href="{% if request.resolver_match.url_name != 'home' %}{% url 'home' %}{% endif %}#top-destination">Destination</a></li>
                <li><a href="{% if request.resolver_match.url_name != 'home' %}{% url 'home' %}{% endif %}#Travel-blog">Gallery</a></li>
                <li><a href="{% url 'contact' %}">Contact</a></li>
            </ul> 

            <!-- Auth Buttons -->
            <div class="auth-buttons">
                {% if request.user.is_authenticated %}
                    <a href="{% url 'my_bookings' %}" class="btn-custom-register">My Bookings</a>
                    <a href="{% url 'logout' %}" class="btn-custom-login">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn-custom-login">Login</a>
                    <a href="{% url 'register' %}" class="btn-custom-register">Register</a>
                {% endif %}
            </div> 
        </div>
    </div>
</header>

<script>
    // Add sticky behavior
    window.addEventListener('scroll', function() {
        const navbar = document.getElementById('main-navbar');
        if (window.scrollY > 50) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    });

    // Mobile Menu Toggle
    document.getElementById('mobile-toggle-btn').addEventListener('click', function() {
        document.getElementById('main-navbar').classList.toggle('mobile-menu-active');
        const icon = this.querySelector('i');
        if (icon.classList.contains('fa-bars')) {
            icon.classList.remove('fa-bars');
            icon.classList.add('fa-xmark');
        } else {
            icon.classList.remove('fa-xmark');
            icon.classList.add('fa-bars');
        }
    });
</script>
